<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Buzzer Live - Redirection</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Redirects 404s to index.html with route preserved
      var segmentCount = 0;
      var l = window.location;
      var pathSegments = l.pathname.split('/').slice(1);
      if (pathSegments[0] && pathSegments[0] !== '') {
        // If hosted at /repo-name/, redirect to root with path encoded in query or hash
        l.replace(
          l.protocol + '//' + l.host + '/' + pathSegments[0] + '/?p=/' + pathSegments.slice(1).join('/') + (l.search ? '&' + l.search.slice(1) : '') + l.hash
        );
      } else {
        l.replace(l.protocol + '//' + l.host + '/?p=/');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
